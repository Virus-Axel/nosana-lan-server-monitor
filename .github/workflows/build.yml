name: Build Android APK (Tauri)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install pnpm deps
        run: pnpm install

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Initialize Tauri Android (if needed)
        run: |
          pnpm tauri android init || true

      - name: Install OpenSSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl pkg-config

      - name: Fix Android NDK toolchain compatibility
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          COMPAT_DIR="$RUNNER_TEMP/android-toolchain"
      
          mkdir -p "$COMPAT_DIR"
      
          for PREFIX in \
            aarch64-linux-android \
            arm-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          do
            ln -sf "$TOOLCHAIN/llvm-ranlib" "$COMPAT_DIR/$PREFIX-ranlib"
            ln -sf "$TOOLCHAIN/llvm-ar" "$COMPAT_DIR/$PREFIX-ar"
          done
      
          echo "$COMPAT_DIR" >> "$GITHUB_PATH"
      
          echo "Configured Android NDK compatibility aliases:"
          ls -l "$COMPAT_DIR"

      - name: Build APK (debug)
        run: pnpm tauri android build --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/**/*.apk