name: Build Android APK (Tauri)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install pnpm deps
        run: pnpm install

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install OpenSSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl pkg-config

      - name: Fix Android NDK toolchain compatibility
        shell: bash
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          COMPAT_DIR="$RUNNER_TEMP/android-toolchain"

          mkdir -p "$COMPAT_DIR"

          for PREFIX in \
            aarch64-linux-android \
            arm-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          do
            ln -sf "$TOOLCHAIN/llvm-ranlib" "$COMPAT_DIR/$PREFIX-ranlib"
            ln -sf "$TOOLCHAIN/llvm-ar" "$COMPAT_DIR/$PREFIX-ar"
          done

          echo "$COMPAT_DIR" >> "$GITHUB_PATH"

          echo "Configured Android NDK compatibility aliases:"
          ls -l "$COMPAT_DIR"

      # --------------------------------------------------
      # Debug build
      # --------------------------------------------------

      - name: Build APK (debug)
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Debug build attempt $attempt of 3"

            if pnpm tauri android build --debug; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Debug build failed after 3 attempts."
          exit 1

      # --------------------------------------------------
      # Configure Android release signing
      # --------------------------------------------------

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEY_BASE64" ]]; then
            echo "Missing ANDROID_KEY_BASE64 secret"
            exit 1
          fi

          if [[ -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "Missing ANDROID_KEY_ALIAS secret"
            exit 1
          fi

          if [[ -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing ANDROID_KEY_PASSWORD secret"
            exit 1
          fi

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$RUNNER_TEMP/nlsm-release-key.jks"

          mkdir -p "$ANDROID_DIR"

          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat > "$ANDROID_DIR/keystore.properties" <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$KEYSTORE_PATH
          EOF

          chmod 600 "$KEYSTORE_PATH" "$ANDROID_DIR/keystore.properties"

          echo "Android release signing configured."

      # --------------------------------------------------
      # Release build
      # --------------------------------------------------

      - name: Build APK (release)
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Release build attempt $attempt of 3"

            if pnpm tauri android build; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Release build failed after 3 attempts."
          exit 1

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release \
            -name "*.apk" -type f | head -n 1)

          if [[ -z "$APK" ]]; then
            echo "Release APK not found"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose "$APK"

          echo "Verified signed APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error